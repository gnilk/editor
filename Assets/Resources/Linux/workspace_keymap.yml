#
# Keymap file for the workspace view.
#
# Every binding the workspace view needs is identical to default_keymap, so this
# is a pure-inheritance keymap: it declares no bindings of its own and re-uses
# default_keymap wholesale. (An empty/absent 'actions' section is valid for a
# keymap that only inherits.)
#
keymap: {
  inherit: default_keymap
}
