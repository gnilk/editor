#
# Terminal/shell view keymap.
# Inherits all bindings from default_keymap and overrides Tab to send a raw completion byte to the pty.
# PageUp/PageDown already inherit as NavigatePageUp/Down -> kUIActionPageUp/Down, which page the
# backlog at the prompt (docs/terminal-scrollback.md §5.3). Ctrl+Home/End jump to backlog top/bottom
# (Ctrl+PageUp/Down is already taken by GotoTopLine/BottomLine, UINavigationModifier+Home/End by
# GotoFirstLine/LastLine). Alt+Up/Down jump to the previous/next command block (§5.4) - uses the
# literal KeyCode_Alt rather than the UINavigationModifier alias: alias substitution only consults
# THIS keymap's own 'modifiers:' table (RebuildActionMapping runs before 'inherit' is resolved), and
# this file doesn't have one.
#
keymap: {
  inherit: default_keymap,
  actions: {
    ShellCompletion: KeyCode_Tab,
    NavigateHome: KeyCode_Ctrl + KeyCode_Home,
    NavigateEnd: KeyCode_Ctrl + KeyCode_End,
    NavigatePrevPrompt: KeyCode_Alt + KeyCode_UpArrow,
    NavigateNextPrompt: KeyCode_Alt + KeyCode_DownArrow,
  }
}
