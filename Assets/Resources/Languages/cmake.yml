# CMake (docs/support-languages.md §6): CMakeLists.txt and *.cmake.
#
# Commands ignore case (add_executable = ADD_EXECUTABLE), so the language is case_sensitive: no. The argument keywords
# don't - PUBLIC is one, 'public' is a value - so their entry says case_sensitive: yes.
#   keyword      the control flow: if / foreach / function / ... and their ends
#   function     every other command, the common module ones included (FetchContent_Declare, ...)
#   known_type   the argument keywords (PUBLIC, REQUIRED, VERSION, ...), if()'s operators, sub-commands
#   enum_value   ON / OFF / TRUE / FALSE / ...
#   macro_identifier   a variable reference: ${VAR}, $ENV{VAR}, $CACHE{VAR} - nested ones too, in strings too
#   preprocessor       a generator expression: $<...>
language:
  name: cmake
  display: CMake
  inherit: default
  extensions: [".cmake"]
  filenames: ["CMakeLists.txt"]
  author: gnilk
  date: 2026-11-17
  version: 1
  line_comment: "#"
  case_sensitive: no

tokenizer:
  start: main
  states:
    main:
      # What ends a word. Not '-', '.' or '/': they are part of an unquoted argument (a path, a flag)
      postfix: "( ) \" # ${ $< $ENV{ $CACHE{ [[ ;"
      numbers: generic
      tokens:
        - { class: operator, words: "( ) ;" }
        - { class: macro_identifier, words: "${ $ENV{ $CACHE{", push: in_var }
        - { class: preprocessor, words: "$<", push: in_genex }
        - { class: string, words: "\"", push: in_string }
        - { class: string, words: "[[", push: in_bracket }
        - { class: block_comment, words: "#[[", push: in_bracket_comment }
        - { class: line_comment, words: "#", push: in_line_comment }
        - class: keyword
          whole_word: yes
          words: "if elseif else endif foreach endforeach while endwhile function endfunction macro endmacro
                  return break continue block endblock"
        - class: function
          whole_word: yes
          words: "add_compile_definitions add_compile_options add_custom_command add_custom_target add_definitions
                  add_dependencies add_executable add_library add_link_options add_subdirectory add_test
                  aux_source_directory build_command cmake_host_system_information cmake_language
                  cmake_minimum_required cmake_parse_arguments cmake_path cmake_pkg_config cmake_policy configure_file
                  create_test_sourcelist define_property enable_language enable_testing execute_process export file
                  find_file find_library find_package find_path find_program get_cmake_property
                  get_directory_property get_filename_component get_property get_source_file_property
                  get_target_property get_test_property include include_directories include_external_msproject
                  include_guard include_regular_expression install link_directories link_libraries list load_cache
                  mark_as_advanced math message option project remove_definitions separate_arguments set
                  set_directory_properties set_property set_source_files_properties set_target_properties
                  set_tests_properties site_name source_group string target_compile_definitions
                  target_compile_features target_compile_options target_include_directories target_link_directories
                  target_link_libraries target_link_options target_precompile_headers target_sources try_compile
                  try_run unset variable_watch
                  fetchcontent_declare fetchcontent_makeavailable fetchcontent_getproperties fetchcontent_populate
                  externalproject_add externalproject_add_step check_include_file check_include_file_cxx
                  check_cxx_source_compiles check_c_source_compiles check_symbol_exists check_cxx_compiler_flag
                  check_c_compiler_flag check_function_exists check_library_exists pkg_check_modules
                  pkg_search_module find_package_handle_standard_args write_basic_package_version_file
                  configure_package_config_file gtest_discover_tests gtest_add_tests cpack_add_component"
        - class: known_type
          whole_word: yes
          case_sensitive: yes
          words: "PUBLIC PRIVATE INTERFACE REQUIRED QUIET COMPONENTS OPTIONAL_COMPONENTS CONFIG MODULE NO_MODULE
                  VERSION LANGUAGES DESCRIPTION HOMEPAGE_URL STATIC SHARED OBJECT IMPORTED ALIAS GLOBAL
                  EXCLUDE_FROM_ALL WIN32 MACOSX_BUNDLE CACHE STRING BOOL PATH FILEPATH INTERNAL FORCE PARENT_SCOPE
                  APPEND APPEND_STRING PROPERTY PROPERTIES TARGET TARGETS DIRECTORY SOURCE SOURCES TEST FILES
                  PROGRAMS DESTINATION RUNTIME LIBRARY ARCHIVE INCLUDES COMPONENT EXPORT NAMESPACE FILE OUTPUT COMMAND
                  DEPENDS BYPRODUCTS WORKING_DIRECTORY COMMENT VERBATIM USES_TERMINAL ALL PRE_BUILD PRE_LINK
                  POST_BUILD MAIN_DEPENDENCY RESULT_VARIABLE OUTPUT_VARIABLE ERROR_VARIABLE
                  OUTPUT_STRIP_TRAILING_WHITESPACE ERROR_QUIET OUTPUT_QUIET COMMAND_ECHO GIT_REPOSITORY GIT_TAG
                  GIT_SHALLOW URL URL_HASH SOURCE_DIR BINARY_DIR NAMES HINTS PATHS PATH_SUFFIXES NO_DEFAULT_PATH
                  NO_CACHE STATUS WARNING AUTHOR_WARNING SEND_ERROR FATAL_ERROR DEPRECATION NOTICE VERBOSE DEBUG
                  TRACE CHECK_START CHECK_PASS CHECK_FAIL
                  NOT AND OR DEFINED EXISTS COMMAND POLICY IS_DIRECTORY IS_ABSOLUTE IS_SYMLINK IS_NEWER_THAN MATCHES
                  LESS GREATER EQUAL LESS_EQUAL GREATER_EQUAL STREQUAL STRLESS STRGREATER STRLESS_EQUAL
                  STRGREATER_EQUAL VERSION_LESS VERSION_GREATER VERSION_EQUAL VERSION_LESS_EQUAL
                  VERSION_GREATER_EQUAL IN_LIST PATH_EQUAL IN_LISTS ITEMS RANGE ZIP_LISTS
                  REPLACE REGEX MATCH MATCHALL TOUPPER TOLOWER LENGTH SUBSTRING STRIP JOIN FIND GET INSERT
                  REMOVE_ITEM REMOVE_AT REMOVE_DUPLICATES REVERSE SORT FILTER TRANSFORM GLOB GLOB_RECURSE READ WRITE
                  COPY MAKE_DIRECTORY CONFIGURE_DEPENDS RELATIVE INCLUDE EXCLUDE SYSTEM BEFORE AFTER PREPEND"
        - class: enum_value
          whole_word: yes
          words: "ON OFF TRUE FALSE YES NO IGNORE NOTFOUND"
    # ${VAR} - a reference can nest: ${${prefix}_DIR}
    in_var:
      regular: macro_identifier
      postfix: "} ${"
      tokens:
        - { class: macro_identifier, words: "}", pop: yes }
        - { class: macro_identifier, words: "${", push: in_var }
    # $<CONFIG:Debug>, $<$<BOOL:${X}>:-g> - nests, and holds variable references
    in_genex:
      regular: preprocessor
      postfix: "> $< ${"
      tokens:
        - { class: preprocessor, words: ">", pop: yes }
        - { class: preprocessor, words: "$<", push: in_genex }
        - { class: macro_identifier, words: "${", push: in_var }
    # "..." - across lines; \" doesn't close it; references and generator expressions inside
    in_string:
      regular: string
      postfix: "\" \\ ${ $<"
      tokens:
        - { class: string, words: "\\\\ \\\" \\" }
        - { class: string, words: "\"", pop: yes }
        - { class: macro_identifier, words: "${", push: in_var }
        - { class: preprocessor, words: "$<", push: in_genex }
    # A bracket argument: [[ ... ]] - raw, across lines
    in_bracket:
      regular: string
      postfix: "]]"
      tokens:
        - { class: string, words: "]]", pop: yes }
    # #[[ ... ]] - a comment across lines
    in_bracket_comment:
      regular: commented_text
      postfix: "]]"
      tokens:
        - { class: block_comment, words: "]]", pop: yes }
    in_line_comment:
      regular: commented_text
      eol: pop

# No single quotes in CMake
autopairs:
  pairs:
    - { open: "(",  close: ")" }
    - { open: "[",  close: "]" }
    - { open: "{",  close: "}" }
    - { open: "\"", close: "\"", quote: yes }
