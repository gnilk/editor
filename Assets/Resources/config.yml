# Merge order: this file (system) -> user config (~/.config/goatedit/ or ~/.goatedit/ on macOS,
# ~/.local/share/goatedit/ or ~/.goatedit/ on Linux) -> project config <root>/.goatedit/config.yml.
# A project config can override anything EXCEPT keys that run commands/code or write files:
# main.bootstrap_scripts, main.plugin_directory, terminal.shell/init/bootstrap, logging.logfile.
# Lists merge item-by-item (a later config can change/extend a list, not shorten it).
# session.auto_create_project_dir has no effect in a project config (the dir must exist to be read).
# From the editor: .cfg [--user | --project] list | get <key> | set <key> <value> | edit
# (set edits the file in place - comments are kept; the system config is never written).
#
main:
  backend: sdl
  theme: default.theme.yml
  # auto-pairing rules (brackets/quotes)
  autopairs: autopairs.yml
  # auto-indent rules (newline indent + dedent-on-type)
  indent: indent.yml
  # select the keymap default for the backend
  # 'default' is a reserved word - replace with your file name when forking it...
  keymap: "default_keymap"
  threaded_syntaxparser: yes
  # time in milliseconds before automatically saving a file after changes...
  # 0 disables autosave
  autosave_timeout_ms: 1000
  plugin_directory: Plugins
  bootstrap_script_comment: "//"
  cmdlet_prefix: "."
  bootstrap_scripts:
    - bootstrap.script
    - ~/.gedit

#
# During initial boot up the console is the logger but once we have the config loaded the logger will reinitalize
#
logging:
  # supported options: filesink, console
  logsink: filesink
  logfile: goatedit.log
  disable_all: yes
  # there are many modules - and no way to list them (grep src/Core for "::GetLogger")
  enable_modules:
#    - "AnsiParser"
#    - "KeyMapping"
#    - "TextBuffer"
#    - "Layout"
#    - "HSplitView"
#    - "AssetLoader"
#    - "System"
#    - "RootView"
#    - "Document"
#    - "EditorView"
#    - "EditorController"
#    - "TextBuffer"
#    - "RunLoop"
#    - "Dispatcher"
#    - "KeyPress"


# Global mouse behaviour. Double-click timing is application-wide (not per-view), so it lives in its
# own top-level block rather than under any one view's section.
mouse:
  # Maximum time (milliseconds) between two presses for them to count as a double-click. Both presses
  # must also land on the same character cell with the same button. Honoured by the user-config merge.
  dbl_click_speed: 250

# Watches the open folders for files written by anyone (an agent, the terminal, other editors) and keeps the
# workspace tree and the code index current.
foldermonitor:
  enabled: yes
  # Note: for macos this can only be maximum 8 folders - or else!

# Marks the current change set - what 'git status' lists - in the workspace tree (docs/usability-round.md §0).
# Runs 'git status' in the background when the folder monitor reports a change, and when a git operation (commit,
# add, checkout, reset, ...) changes '.git/index' or '.git/HEAD', checked every 'check_interval_ms' by their
# modification times - that check runs no process. Nothing runs while nothing changes.
# With 'foldermonitor' off, files changed outside the editor without git (an agent writing them) aren't seen until
# the next git operation: keep the folder monitor on when working with an agent.
# Also switches the change marks in the gutter (§0c): each open file as the last commit has it ('git show'), fetched
# when it opens and when the change set changes, compared with the buffer after a pause in typing.
repomonitor:
  enabled: yes
  check_interval_ms: 1000

# Scan-time filtering, owned by the Workspace (ExclusionRules) and shared with the folder monitor and the code
# index. Excluded names/globs are pruned AT SCAN TIME -> the matching dirs never
# enter the node tree (build dirs / generated trees). Distinct from workspaceview.hide_dot_files, which
# is a VIEW-time filter (dotfiles stay scanned, just hidden).
workspace:
  # Also honour the repository's '.gitignore' files. Ignored items stay in the workspace view, dimmed and read
  # only when expanded (workspaceview.show_ignored); the code index and the folder monitor skip them. 'exclude'
  # below is the hard list: nothing shows or touches those.
  use_git_ignore: yes
  # Backstop against pathological recursion depth only (symlink cycles are handled separately by the
  # scanner's no-follow default). Set to 1 so only the top level of each folder is scanned
  # eagerly; deeper directories are frontier nodes (isScanned=false) expanded on demand via
  # the lazy-expansion hook (FolderScanner FS-6 — docs/folder-scanner.md §12). The lazy UX
  # is fully wired (W1–W5 done), so lowering this defers rather than truncates.
  max_scan_depth: 6
  # Nothing shows or touches these. Build folders don't belong here: '.gitignore' covers them, which keeps them
  # browsable in the workspace view.
  exclude:
    - ".git"
    - ".github"
    - ".idea"

# The code index behind Go to symbol (docs/code-index.md): project folders are indexed in the background
# with the excludes above. Only files with a structure scanner (C/C++); larger ones are skipped.
codeindex:
  enabled: yes
  max_file_size_kb: 4096

#
# keymapping varies a bit for native feel, thus - each OS has their own file to map nicely
# in order to change this you need to copy the file and override it completely
# note: DO NOT use the same filename as in the default configuration!
#
macos:
  allow_kbd_hook: no
  default_keymap: macOS/default_keymap.yml
  quickmode_keymap: macOS/quickmode_keymap.yml
  workspace_keymap: macOS/workspace_keymap.yml
  terminal_keymap: macOS/terminal_keymap.yml
  modal_keymap: macOS/modal_keymap.yml

linux:
  default_keymap: Linux/default_keymap.yml
  quickmode_keymap: Linux/quickmode_keymap.yml
  workspace_keymap: Linux/workspace_keymap.yml
  terminal_keymap: Linux/terminal_keymap.yml
  modal_keymap: Linux/modal_keymap.yml

sdl:
  # Defines the SDL window rendering backend 'opengl', 'vulkan', 'metal' - empty or unknown means default...
  backend: "opengl"
  # When drawing underlined text this defines how many pixels from the regular baseline of the font to offset the line
  text_underline_margin: 16
  # this increases the spacing between lines - it is added to the baseline of the font
  line_margin: 4
  # Fonts that draw what the theme's font has no glyph for (CJK, box drawing, symbols), tried in order. A file that
  # isn't there is skipped, so the list holds both platforms' paths. Colour emoji fonts can't be used (no outlines).
  font_fallback:
    # Linux
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
    - /usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf
    - /usr/share/fonts/truetype/noto/NotoSansSymbols2-Regular.ttf
    - /usr/share/fonts/truetype/ancient-scripts/Symbola_hint.ttf
    # macOS
    - /System/Library/Fonts/Menlo.ttc
    - /System/Library/Fonts/Supplemental/Arial Unicode.ttf
    - /Library/Fonts/Arial Unicode.ttf
    - /System/Library/Fonts/Apple Symbols.ttf
  # After the theme's font and the list above, ask the system (CoreText / fontconfig) for a font that has the glyph.
  # Off: a glyph none of them has is an empty cell.
  system_font_fallback: yes

ncurses:
  timeoutKeyEvent: 500
  keymap: "ncurses_default.keymap"

#
# Set up details for the 3 main views
#

editorview:
  # content_first is CLion/Sublime style (no = VSCode style, cursor first)
  pgupdown_content_first: yes
  # Number of lines to scroll per mouse-wheel notch
  lines_per_scroll_wheel_notch: 5
  # Soft-wrap of long lines: none | char | word
  wrap: none
  keymap: "default_keymap"

# The whole file at the editor's right edge (docs/usability-round.md §7) - on screens that draw pixels (SDL)
minimap:
  enabled: yes
  # In character cells - a character is a pixel wide, so 10 cells hold ~100 characters
  width: 10
  # A short file doesn't stretch: at most this many pixels a line
  max_pixels_per_line: 2
  # The text's strength over the background, 0..1 - lower makes the change marks and the box stand out (VS Code ~0.4)
  text_strength: 0.4
  # Logical pixels between the change marks at the left edge and the text
  marks_gap: 4

workspaceview:
  keymap: "workspace_keymap"
  switch_to_editor_on_openfile: yes
  auto_expand_view: yes
  hide_dot_files: no
  # Show what '.gitignore' leaves out, dimmed. ToggleIgnored (Alt+H in this view) flips it for the session.
  show_ignored: yes
  # Number of rows to scroll per mouse-wheel notch
  lines_per_scroll_wheel_notch: 1
  # Letters typed in the tree jump to the next row whose name starts with them; a pause this long starts a new name
  type_to_find_pause_ms: 1000


quickmode:
  # this will leave the quick-command mode automatically when a successfull command has been executed
  # while this can be nice, it's cumbersome if used for navigation...
  leave_automatically: true
  leave_when_switching_view: true
  prompt_default: "Q:"
  prompt_search: "S:"
  prompt_cmdlet: "C:"
  keymap: "quickmode_keymap"



# old keymap
# This keymap is tested with macbook with external keyboard..
# Note: Keymap should point to a file instead..
temptemp: {
  # test
  #KeyCode_Shift + KeyCode_UpArrow : NavigateEnd,
  #KeyCode_Ctrl + KeyCode_Shift + KeyCode_UpArrow : NavigateHome,
  # properly mapped
  KeyCode_UpArrow : NavigateLineUp,
  KeyCode_DownArrow : NavigateLineDown,

  # Test - map to same action - but NavigateLineDown will check if this is pressed and invoke selection..
  KeyCode_Shift + KeyCode_DownArrow : NavigateLineDown,
  KeyCode_Shift + KeyCode_UpArrow : NavigateLineUp,

  # Should be able to mark a modifier as 'optional' for an action
  # like: KeyCode_DownArray + @KeyCode_Shift : NavigateDown
  # or:   @KeyCode_Shift + KeyCode_DownArray : NavigateDown
  #
  # This would then insert two actions in the table one with 'Shift' and one without..
  # Or Perhaps lik this:
  #
  # @SelectionModifier + KeyCode_DownArray : NavigateDown
  #
  # Change this to:
  # Action = Key combo
  # Will allow for other stuff like: var <variable> : some key code stuff
  # and then reuse/substitue later will be easier and more 'logical'
  # It also reads like a proper expression...
  #

  KeyCode_LeftArrow : NavigateLineStepLeft,
  KeyCode_RightArrow : NavigateLineStepRight,
  KeyCode_PageUp : NavigatePageUp,
  KeyCode_PageDown : NavigatePageDown,
  KeyCode_Return : CommitLine,
  KeyCode_Command + KeyCode_Home : GotoFirstLine,
  KeyCode_Command + KeyCode_End : GotoLastLine,
  KeyCode_Command + KeyCode_PageUp : GotoTopLine,
  KeyCode_Command + KeyCode_PageDown : GotoBottomLine,
  # doesnt work on MacBookPro laptop keyboard (ALT+Left/RightArrow return 'b'/'f' - modifier is correct!)
  KeyCode_LeftCmd + KeyCode_LeftArrow : NavigateLineWordLeft,
  KeyCode_LeftCmd + KeyCode_RightArrow : NavigateLineWordRight,
  KeyCode_Escape : CycleActiveView,
  KeyCode_F3 : CycleActiveEditor,

  KeyCode_Command + 'c' : CopyToClipboard,
  KeyCode_Command + 'v' : PasteFromClipboard,

}

#
# Terminal: the embedded shell + its view. ONE section for everything the terminal exposes to the
# user (shell/process settings + the view's keymap/scroll/markers; formerly split with 'commandview').
#
terminal:
  # Shell binary. Leave unset to use the login shell ($SHELL); a configured shell that is not
  # executable also falls back to $SHELL, then /bin/sh.
  # shell: /bin/zsh
  init: -is
  # This is a set of shell commands run after starting the shell..
  # Consider merging with the generic main bootstrap script..
  bootstrap: []
  # Max number of scrollback lines kept in memory per terminal (the oldest go). 0 = unlimited.
  scrollback_lines: 10000
  # Persist terminal scrollback across sessions (docs/terminal-scrollback.md §8). On by default, but
  # gated on a project `.goatedit` dir - the history is written to <root>/.goatedit/terminal_scrollback.bin
  # (a versioned binary keeping line text + ANSI colours) next to session.yml, on a clean exit only.
  persist_scrollback: yes
  # Max scrollback lines written to disk on save (the in-memory cap above can be larger). Keeps the
  # .bin bounded; the most recent N lines are kept.
  persist_scrollback_lines: 2000
  # OSC 133 shell integration (docs/terminal-scrollback.md §4.2 / Phase 3). When on, the bootstrap
  # injects bash/zsh prompt hooks that emit semantic-prompt markers, so where a command's output starts
  # (Terminal.GetLastOutput) is exact instead of guessed at Enter. Off by default - it rewrites PS1.
  shell_integration: no
  # What Alt(Option)+Left/Right sends to an app in the terminal: 'words' = ESC b / ESC f (readline word motion,
  # what Terminal.app/iTerm2 send), 'xterm' = CSI 1;3D / 1;3C. Unset: words on macOS, xterm on Linux.
  # alt_arrows: words
  # --- Terminal view (these were the separate 'commandview' section; consolidated here so the
  #     terminal has ONE config section from the user's point of view) ---
  # Keymap used while the terminal/command input view is active.
  keymap: terminal_keymap
  # Number of backlog rows to scroll per mouse-wheel notch (§5.3 docs/terminal-scrollback.md)
  lines_per_scroll_wheel_notch: 3

languages:
  # Defines the maximum number of lines we extend a region for the syntax parser
  regionMaxLines: 1000
  default:
    indent: 4
    tabsize: 4
    insert_spaces: yes
  cpp:
    insert_closing_brace: yes
    auto_indent: yes
    continue_comment: yes
    semantic_highlighting: yes  # colour types/functions/members/macros the file itself declares (docs/code-index.md §10.1)
  yaml:
    tabsize: 2                  # YAML is conventionally indented by 2 (and never with tabs)

# Session cache — restore a project as you left it (docs/session-cache.md). Phase 1: per-root
# <root>/.goatedit/session.yml with open files + cursors (+ layout/geometry as those land).
session:
  enabled: yes                  # master switch for session persistence
  auto_create_project_dir: yes  # create <root>/.goatedit/ on FOLDER open (in-home roots); never for a single file
  persist_external: no          # sessions for roots OUTSIDE $HOME (Step 2; central only)
  restore_open_files: yes       # reopen the documents (tabs) + cursors on launch
  restore_layout: yes           # splitters / terminal pane
  restore_window_geometry: yes  # window size/position
  autosave_timeout_ms: 1500     # debounce delay before a meaningful change is flushed to disk (0 = off)
