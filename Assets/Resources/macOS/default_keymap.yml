#
# default keymap, this is used in the text editor and any other that does not declare their own keymapping file
#
keymap: {
  # Editor will read this and check the modifier mask controlling an action
  # For instance, the 'SelectionModifier' is used to enable/disable selections
  modifiers: {
    SelectionModifier: KeyCode_Shift,
    CopyPasteModifier: KeyCode_Cmd,
    UINavigationModifier: KeyCode_Alt,
  },
  # We could allow different actions depending on what we have..
  # for instance when a 'modal' is active we don't really need all of this...
  # and we want other 'action names' (Esc = CloseModal, etc..)
  actions: {
    NavigateLineUp: KeyCode_UpArrow + @SelectionModifier,
    NavigateLineDown: KeyCode_DownArrow + @SelectionModifier,
    NavigateLeft: KeyCode_LeftArrow + @SelectionModifier,
    NavigateRight: KeyCode_RightArrow + @SelectionModifier,
    NavigatePageUp: [
      KeyCode_PageUp + @SelectionModifier,
      KeyCode_UpArrow + KeyCode_Cmd + @SelectionModifier,
    ],
    NavigatePageDown: [
      KeyCode_PageDown + @SelectionModifier,
      KeyCode_DownArrow + KeyCode_Cmd + @SelectionModifier
    ],
    NavigateLineEnd: [
      KeyCode_End + @SelectionModifier,
      KeyCode_RightArrow + KeyCode_Cmd + @SelectionModifier
    ],
    NavigateLineHome: [
      KeyCode_Home + @SelectionModifier,
      KeyCode_LeftArrow + KeyCode_Cmd + @SelectionModifier
    ],
    CopyToClipboard: CopyPasteModifier + 'c',
    PasteFromClipboard: CopyPasteModifier + 'v',
    CutToClipboard: CopyPasteModifier + 'x',
    EnterCommandMode: KeyCode_Escape,
    CycleActiveViewNext: "UINavigationModifier + ']'",
    CycleActiveViewPrev: "UINavigationModifier + '['",
    CycleBufferNext: "UINavigationModifier + '\\'",
    CycleBufferPrev: "UINavigationModifier + '\''",
    # Buffer N (the tab number in the header; 9 = the last): Cmd+N is the macOS standard, Alt+N the
    # UI-navigation house style (and the Linux standard)
    SwitchToBuffer: [
      "KeyCode_Command + '1'", "KeyCode_Command + '2'", "KeyCode_Command + '3'",
      "KeyCode_Command + '4'", "KeyCode_Command + '5'", "KeyCode_Command + '6'",
      "KeyCode_Command + '7'", "KeyCode_Command + '8'", "KeyCode_Command + '9'",
      "UINavigationModifier + '1'", "UINavigationModifier + '2'", "UINavigationModifier + '3'",
      "UINavigationModifier + '4'", "UINavigationModifier + '5'", "UINavigationModifier + '6'",
      "UINavigationModifier + '7'", "UINavigationModifier + '8'", "UINavigationModifier + '9'",
    ],
    CycleActiveEditor: KeyCode_F3,
    CommitLine: KeyCode_Return,
    CommentLine: CopyPasteModifier + '/',
    GotoFirstLine: KeyCode_Command + KeyCode_Home + @SelectionModifier,
    GotoLastLine: KeyCode_Command + KeyCode_End + @SelectionModifier,
    GotoTopLine: KeyCode_Command + KeyCode_PageUp,
    GotoBottomLine: KeyCode_Command + KeyCode_PageDown,
    Undo: CopyPasteModifier + 'z',

    Indent : KeyCode_Tab,
    Unindent : KeyCode_Shift + KeyCode_Tab,
    ReformatLine: "CopyPasteModifier + 'l'",
    ReformatBlock: "CopyPasteModifier + 'i'",
    SelectAll: "CopyPasteModifier + 'a'",

    # Find in the active document (a dialog listing the hits) - Cmd+F / Ctrl+F
    Find: "CopyPasteModifier + 'f'",
    # Go to symbol - search the code index of the whole workspace - Cmd+T / Ctrl+T
    GotoSymbol: "CopyPasteModifier + 't'",
    # Open a file by part of its name, from anywhere
    QuickOpen: "CopyPasteModifier + 'p'",
    ShowOpenFiles: "CopyPasteModifier + 'e'",
    ShowRelationships: "CopyPasteModifier + SelectionModifier + 't'",
    # Smart go-to on the name under the cursor, back and forward through the jumps (docs/code-index.md §5.6).
    # GotoDefinition and GotoDeclaration exist too, without a key of their own.
    GotoToggle: "CopyPasteModifier + 'b'",
    GotoImplementation: "CopyPasteModifier + SelectionModifier + 'b'",
    GotoBase: "CopyPasteModifier + SelectionModifier + 'u'",
    # The type of the member, variable or function under the cursor - 'i' is a stand-in
    GotoType: "CopyPasteModifier + SelectionModifier + 'i'",
    JumpBack: "CopyPasteModifier + '['",
    JumpForward: "CopyPasteModifier + ']'",
    # Next/previous search hit - Cmd+G / Cmd+Shift+G is the macOS standard (Ctrl on Linux)
    NextSearchResult: "KeyCode_Command + 'g'",
    PrevSearchResult: "KeyCode_Command + SelectionModifier + 'g'",

    # This doesn't work unless we are in modal-mode..
    # CloseModal : KeyCode_Escape,
    # WASD
    UIIncreaseViewWidth : "UINavigationModifier + 'd'",
    UIDecreaseViewWidth : "UINavigationModifier + 'a'",
    UIIncreaseViewHeight : "UINavigationModifier + 's'",
    UIDecreaseViewHeight : "UINavigationModifier + 'w'",
    UIMaximizeViewHeight : "UINavigationModifier + 'm'",

    # Switch views
    UISwitchToTerminal : "UINavigationModifier + 't'",
    UISwitchToEditor : "UINavigationModifier + 'e'",
    UISwitchToProject : "UINavigationModifier + 'p'",

    # View mode (text / hex projection)
    UIViewModeText : "UINavigationModifier + 'r'",
    UIViewModeHex : "UINavigationModifier + 'h'"
  },
  # Clicks that stand for an action (docs/usability-round.md §13): Click, DoubleClick, TripleClick, MiddleClick, with
  # modifiers as keys have them. The view under the pointer handles the click first (caret, selection), then this.
  # Not inherited by other keymaps - a click acts on what is under the pointer.
  mouse: {
    # Cmd+click: to the definition, as the key does
    GotoToggle: "CopyPasteModifier + Click",
  }
}
