commands:
  -
    name: testcmd
    short: tc
    description: test command
    script: Scripts/testcmd.js
  -
    name: help
    short: h
    description: help
    script: Scripts/help.js
  -
    name: hello
    short: hello
    description: hello
    script: Scripts/hello.js
  -
    name: setlanguage
    short: sl
    description: Set the language of the active buffer
    script: Scripts/setlanguage.js
    arguments:
      - string, language identifier
  -
    name: listlanguages
    short: ll
    description: List supported languages
    script: Scripts/listlanguages.js
  -
    name: listviews
    short: lv
    description: List available views
    script: Scripts/listviews.js
  -
    name: hideview
    short: hv
    description: Hide a view
    script: Scripts/hideview.js
  -
    name: showview
    short: sv
    description: Show a view
    script: Scripts/showview.js
  -
    name: isviewvisible
    short: ivv
    description: Tells if view is visible or not
    script: Scripts/isviewvisible.js
  -
    name: quit
    short: q
    description: Quit/Exit Editor ('!' exits even with changes not yet saved)
    script: Scripts/exiteditor.js
  -
    name: newbuffer
    short: nb
    description: New Buffer / File
    script: Scripts/newbuffer.js
    arguments:
      - string, name
  -
    name: listbuffers
    short: lb
    description: List Buffers
    script: Scripts/listbuffers.js

  -
    name: copyoutput
    short: co
    description: Copy the last terminal command's output to the clipboard
    script: Scripts/copyoutput.js

  -
    name: outputtobuffer
    short: ob
    description: Open the last terminal command's output in a new buffer
    script: Scripts/outputtobuffer.js

  -
    name: closeactive
    short: cb
    description: Close Active Buffer (asks when it has changes not yet saved; '!' closes anyway)
    script: Scripts/closeactive.js

  -
    name: closeall
    short: ca
    description: Close All Buffers (asks when any has changes not yet saved; '!' closes anyway)
    script: Scripts/closeall.js

  -
    name: openfile
    short: o
    description: Open a file for editing
    script: Scripts/loadbuffer.js
    arguments:
      - string, filename
  -
    name: save
    short: s
    description: Save active buffer (asks when the file was changed on disk; '!' saves anyway)
    script: Scripts/savebuffer.js
  -
    name: reload
    short: rl
    description: Reload active buffer from disk (asks when it has changes not yet saved; '!' reloads anyway)
    script: Scripts/reload.js
  -
    name: fm_file
    short: fmf
    description: Reformat (reindent) the whole active buffer - not for languages where indentation is syntax (YAML)
    script: Scripts/reformatfile.js
  -
    name: fm_block
    short: fmb
    description: Reformat (reindent) the selection, else the enclosing block, else the line - as Cmd+I
    script: Scripts/reformatblock.js
  -
    name: saveas
    short: sa
    description: Save active buffer with a specific filename
    script: Scripts/savebuffer.js
    arguments:
      - string, filename
  -
    name: openfolder
    short: of
    description: Open a folder in to the project viewer
    script: Scripts/openfolder.js
    arguments:
      - string, folder name
  -
    name: theme_reload
    short: thr
    description: Reload current theme
    script: Scripts/themereload.js
  -
    name: theme_list_colors
    short: thc
    description: List colors for current theme
    script: Scripts/listthemecolors.js
    arguments:
      - string, theme color class
  -
    name: theme
    short: theme
    description: "Theme: --import <file> [--name <name>] [--force] - convert a VS Code / Sublime theme"
    script: Scripts/theme.js
    arguments:
      - string, action and its arguments
  -
    name: config
    short: cfg
    description: "Config: [--user | --project] list [prefix] | get <key> | set <key> <value> | edit"
    script: Scripts/config.js
    arguments:
      - string, action and its arguments
