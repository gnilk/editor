#
# Keymap file for the workspace view.
#
# Inherits all shared bindings from default_keymap; only workspace-specific
# overrides live here. NOTE: modifier aliases are resolved per-file (they are
# NOT inherited), so the 'modifiers' block must still define every alias that a
# binding below references.
#
keymap: {
  inherit: default_keymap,
  modifiers: {
    UINavigationModifier : KeyCode_Alt,
  },
  actions: {
    # Hide/show what '.gitignore' leaves out. Replaces the inherited hex view, which means nothing here.
    ToggleIgnored : "UINavigationModifier + 'h'",
  }
}
